  --night:#0e1814; --night-2:#15231e; --night-3:#1d2f28;
  --paper:#f4ecdb; --paper-2:#ebe0c8; --paper-line:#d8c8a6;
  --ink:#231b14; --ink-soft:#5b4b3a; --ink-faint:#8a7760;
  --gold:#c7a25a; --gold-deep:#9c7a36; --gold-bright:#f0dca6;
  --rose:#8c3a45; --rose-soft:#e7c3bf;
  --moon:#e9e1cf; --moon-soft:#b5ab96;
  --serif:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --black:"UnifrakturMaguntia", var(--serif);
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--moon);font-family:var(--serif);font-size:18px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
img,svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- emblem ---------- */
.emblem{display:block;aspect-ratio:832/632;background:currentColor;-webkit-mask:var(--emblem) center/contain no-repeat;mask:var(--emblem) center/contain no-repeat}
.emblem.shine{background:linear-gradient(105deg,var(--gold-deep) 0%,var(--gold) 35%,var(--gold-bright) 48%,#fff6dd 50%,var(--gold-bright) 52%,var(--gold) 65%,var(--gold-deep) 100%);background-size:320% 100%;animation:shine 6s var(--ease) infinite 1.6s}
@keyframes shine{0%{background-position:100% 0}45%,100%{background-position:0 0}}

/* ---------- intro veil ---------- */
.veil{position:fixed;inset:0;z-index:100;background:var(--night);display:grid;place-items:center;transition:opacity .9s var(--ease),visibility .9s}
.veil.gone{opacity:0;visibility:hidden}
.veil .emblem{width:min(46vw,220px);color:var(--gold);animation:veilIn 1.4s var(--ease) both}
.veil p{margin:18px 0 0;text-align:center;font-family:var(--sans);font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--moon-soft);animation:fadeUp 1s var(--ease) .5s both}
@keyframes veilIn{from{opacity:0;filter:blur(14px);transform:scale(.94)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:88px 20px 64px;text-align:center;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(199,162,90,.16),transparent 60%),
    radial-gradient(70% 40% at 50% 78%,rgba(140,58,69,.16),transparent 70%),
    linear-gradient(180deg,#0b1411 0%,var(--night) 45%,var(--night) 100%)}
#lights{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
.arch{position:absolute;z-index:-1;left:50%;top:6%;width:min(560px,120vw);height:auto;transform:translateX(-50%);opacity:.9;pointer-events:none}
.arch path{stroke-dasharray:1;stroke-dashoffset:1}
.ready .arch path{animation:draw 3.2s var(--ease) forwards}
.ready .arch .d2{animation-delay:.35s}.ready .arch .d3{animation-delay:.7s}
.arch .bloom{transform-box:fill-box;transform-origin:center;transform:scale(0)}
.ready .arch .bloom{animation:bloom .9s var(--ease-spring) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bloom{to{transform:scale(1)}}
.lang-top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:3}
.hero-emblem{width:min(64vw,300px);position:relative;margin-top:6vh}
.hero-emblem::after{content:"";position:absolute;inset:-30% -20%;z-index:-1;background:radial-gradient(closest-side,rgba(240,220,166,.16),transparent);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:scale(1.06)}}
.kicker{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin:22px 0 0;padding-left:.4em}
.tagline{font-style:italic;font-weight:400;font-size:clamp(28px,6.4vw,44px);line-height:1.12;margin:14px 0 0;color:var(--moon);text-wrap:balance}
.tagline em{font-style:normal;font-family:var(--black);color:var(--gold-bright);font-size:1.02em}
.place{font-family:var(--sans);font-size:13px;letter-spacing:.08em;color:var(--moon-soft);margin:14px 0 0}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:8px 16px 8px 12px;border:1px solid rgba(199,162,90,.35);border-radius:99px;font-family:var(--sans);font-size:13px;color:var(--moon);background:rgba(14,24,20,.55);backdrop-filter:blur(6px)}
.status i{width:8px;height:8px;border-radius:50%;background:#7fbf8f;box-shadow:0 0 0 0 rgba(127,191,143,.6);animation:pulse 2.2s infinite}
.status.closed i{background:#c9797f;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(127,191,143,0)}100%{box-shadow:0 0 0 0 rgba(127,191,143,0)}}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;margin:34px auto 0;max-width:460px;width:100%;counter-reset:s}
.steps li{position:relative;padding:14px 6px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(233,225,207,.06),rgba(233,225,207,.02));border:1px solid rgba(233,225,207,.08);font-family:var(--sans);font-size:12px;line-height:1.35;color:var(--moon-soft)}
.steps li::before{counter-increment:s;content:counter(s,upper-roman);display:block;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold);line-height:1;margin-bottom:6px}
.steps b{display:block;color:var(--moon);font-weight:500;font-size:13px}
.cta{margin-top:28px;display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border-radius:99px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#23190c;font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 10px 30px -10px rgba(199,162,90,.7),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .35s var(--ease-spring),box-shadow .35s;text-decoration:none;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 4.5s var(--ease) infinite 3s}
@keyframes sweep{30%,100%{transform:translateX(120%)}}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:scale(.97)}
.scroll-cue{margin-top:34px;width:22px;height:36px;border:1px solid rgba(233,225,207,.35);border-radius:12px;position:relative}
.scroll-cue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:cue 2s var(--ease) infinite}
@keyframes cue{60%{transform:translateY(12px);opacity:0}100%{opacity:0}}
.hero .in{opacity:0}
.ready .hero .in{animation:rise 1.1s var(--ease) forwards}
.ready .hero .hero-emblem.in{animation:rise 1.3s var(--ease) .1s forwards,shine 6s var(--ease) 1.8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ---------- language toggle ---------- */
.lang{display:inline-flex;position:relative;padding:3px;border-radius:99px;border:1px solid rgba(199,162,90,.4);background:rgba(14,24,20,.6);backdrop-filter:blur(8px);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em}
.lang button{position:relative;z-index:1;padding:6px 10px;border-radius:99px;color:var(--moon-soft);transition:color .3s}
.lang button[aria-pressed="true"]{color:#23190c}
.lang .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:var(--gold);transition:transform .45s var(--ease-spring)}
.lang[data-lang="en"] .knob{transform:translateX(100%)}

/* ---------- sticky bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(14,24,20,.86);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid rgba(199,162,90,.18);transform:translateY(-105%);transition:transform .5s var(--ease)}
.bar.show{transform:none}
.bar-top{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 4px;max-width:960px;margin:0 auto}
.bar-top .emblem{width:62px;color:var(--gold)}
.bar-top .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--moon);transition:background .25s}
.icon-btn:hover{background:rgba(233,225,207,.08)}
.chips-wrap{position:relative;max-width:960px;margin:0 auto}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px 12px 10px;scroll-behavior:smooth;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;font-family:var(--sans);font-size:13px;color:var(--moon-soft);white-space:nowrap;transition:color .3s}
.chip.active{color:#23190c}
.chip-ind{position:absolute;top:4px;height:32px;border-radius:99px;background:var(--gold);transition:transform .5s var(--ease),width .5s var(--ease);z-index:-1;left:0;width:0}
.chips .chip{position:relative;z-index:1}

/* ---------- menu (paper) ---------- */
.paper{position:relative;background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .35 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  radial-gradient(120% 60% at 50% 0%,#fbf5e8,var(--paper) 60%,var(--paper-2));
  color:var(--ink);padding:72px 0 120px}
.paper::before{content:"";position:absolute;left:0;right:0;top:-1px;height:28px;background:var(--night);-webkit-mask:radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 0/28px 28px repeat-x;mask:radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 0/28px 28px repeat-x}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.menu-head{text-align:center}
.menu-head .ornament{width:180px;margin:0 auto;color:var(--gold-deep)}
.menu-head h2{font-family:var(--black);font-weight:400;font-size:clamp(46px,11vw,72px);line-height:1;margin:6px 0 0;color:var(--ink)}
.menu-head p{margin:10px auto 0;max-width:34ch;color:var(--ink-soft);font-style:italic;font-size:19px}

.tools{position:sticky;top:calc(var(--barH,98px) - 1px);z-index:20;margin:28px -6px 0;padding:10px 6px;background:#f4ecdb;box-shadow:0 12px 14px -12px rgba(60,40,10,.25);border-radius:0 0 16px 16px}
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:16px;font-size:18px;color:var(--ink-faint);pointer-events:none}
.search input{width:100%;height:48px;border-radius:99px;border:1px solid var(--paper-line);background:#fffaf0;padding:0 44px 0 46px;font:500 16px var(--sans);color:var(--ink);box-shadow:inset 0 1px 2px rgba(60,40,10,.06);transition:border-color .25s,box-shadow .25s}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-faint);font-weight:400}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(199,162,90,.18)}
.search .clear{position:absolute;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);opacity:0;pointer-events:none;transition:opacity .2s}
.search.has .clear{opacity:1;pointer-events:auto}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1px solid var(--paper-line);background:rgba(255,250,240,.7);font:500 13px var(--sans);color:var(--ink-soft);transition:all .3s var(--ease)}
.fchip .ico{font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.cat{margin-top:72px;scroll-margin-top:190px}
.cat:first-child{margin-top:36px}
.cat-h{display:flex;align-items:center;gap:14px}
.cat-ic{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:var(--gold-deep);border:1px solid var(--paper-line);background:radial-gradient(circle at 30% 25%,#fffdf6,var(--paper-2))}
.cat-ic .ico{stroke-width:1.2}
.cat-t{flex:1;min-width:0}
.cat-t small{display:block;font:500 11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep)}
.cat-t h3{margin:2px 0 0;font-weight:500;font-size:clamp(30px,7vw,40px);line-height:1.05}
.cat-t p{margin:2px 0 0;font-style:italic;color:var(--ink-soft);font-size:17px}
.rule{height:10px;margin:16px 0 4px;background:
  radial-gradient(circle,var(--gold-deep) 1.6px,transparent 2px) center/10px 10px no-repeat,
  linear-gradient(var(--paper-line),var(--paper-line)) left center/calc(50% - 12px) 1px no-repeat,
  linear-gradient(var(--paper-line),var(--paper-line)) right center/calc(50% - 12px) 1px no-repeat}

.item{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px dashed rgba(156,122,54,.28);cursor:pointer;border-radius:16px;transition:background .3s}
.item:hover{background:rgba(255,250,240,.6)}
.item:last-child{border-bottom:0}
.body{min-width:0}
.item-line{display:flex;align-items:baseline;gap:8px;min-width:0}
.item-name{display:block;font-size:22px;font-weight:600;line-height:1.12}
.item-foot{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px}
.dots{flex:1;min-width:10px;border-bottom:2px dotted rgba(90,70,40,.3);transform:translateY(-5px)}
.price{font:500 15px var(--sans);white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.price small{font-size:12px;color:var(--ink-faint);font-weight:400}
.item-foot .price{font-weight:600;font-size:15.5px;padding:3px 10px;border-radius:8px;background:rgba(199,162,90,.16)}
.item-desc{margin:3px 0 0;color:var(--ink-soft);font-size:17px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-opts{margin:4px 0 0;font:400 12.5px/1.5 var(--sans);color:var(--ink-faint)}
.item-opts b{font-weight:500;color:var(--ink-soft)}
.item-opts i{font-style:normal;color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 7px;border-radius:99px;font:500 11px var(--sans);letter-spacing:.03em;background:rgba(78,110,72,.12);color:#4a6a43}
.tag .ico{font-size:12px}
/* moldura em arco das fotos */
[data-ph]{position:relative;display:grid;place-items:center;overflow:hidden;color:var(--paper-line);background:linear-gradient(110deg,#efe4cc 30%,#f8f0de 45%,#efe4cc 60%) 0 0/300% 100%;animation:ph 1.6s linear infinite}
[data-ph] > .ico{position:absolute;font-size:34px;stroke-width:1}
[data-ph] img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .7s var(--ease),transform 1.2s var(--ease)}
[data-ph] img.ok{opacity:1;transform:none}
[data-ph]:has(img.ok),[data-ph].noimg{animation:none}
[data-ph].noimg{background:radial-gradient(circle at 50% 40%,#fbf5e8,var(--paper-2))}
[data-ph].noimg > .ico{color:var(--gold-deep)}
@keyframes ph{to{background-position:-300% 0}}
.thumb{width:78px;height:96px;border-radius:40px 40px 12px 12px;box-shadow:0 0 0 1px var(--paper-line),0 0 0 4px #fffaf0,0 0 0 5px rgba(199,162,90,.45),0 10px 18px -10px rgba(60,40,10,.45);margin:5px}
.item:hover .thumb img.ok{transform:scale(1.06)}
.ctrl{align-self:center}
.add{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--paper);background:var(--ink);box-shadow:0 6px 14px -6px rgba(35,27,20,.6);transition:transform .35s var(--ease-spring),background .3s}
.add .qn{font:600 15px var(--sans)}
.add:hover{background:var(--rose)}
.add:active{transform:scale(.88)}
.add.sm{width:34px;height:34px;font-size:16px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:99px;background:var(--ink);color:var(--paper);animation:pop .45s var(--ease-spring)}
.stepper button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.stepper button:hover{background:rgba(255,255,255,.1)}
.stepper output{font:600 15px var(--sans);min-width:2ch;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* capa da categoria */
.cover{aspect-ratio:16/9;max-height:300px;width:100%;border-radius:999px 999px 20px 20px / 180px 180px 20px 20px;margin-bottom:22px;box-shadow:0 0 0 1px var(--paper-line),0 0 0 6px #fffaf0,0 0 0 7px rgba(199,162,90,.5),0 24px 40px -24px rgba(60,40,10,.55)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 10%,transparent 55%,rgba(35,27,20,.35));pointer-events:none}
.cover > .ico{font-size:60px}
.cover img{transform:scale(1.18)}
.cover.on img.ok{transform:scale(1);transition:opacity .9s var(--ease),transform 2.6s var(--ease)}
.cat.filtering .cover{display:none}
/* adicionais */
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.item.xi{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:8px;padding:12px 8px 8px 14px;border:1px dashed rgba(156,122,54,.4);border-radius:16px;background:rgba(255,250,240,.55)}
.item.xi.hide{display:none}
.xi-row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
.xi .item-name{font-size:18px;line-height:1.1}
.xi .price{font-size:13.5px;color:var(--ink-soft)}
.mini.dark{background:var(--ink);border-color:var(--ink);color:var(--paper);animation:pop .4s var(--ease-spring)}
.mini.dark button{width:30px;height:30px}
.item.hide{display:none}
.cat.hide{display:none}
.empty{display:none;text-align:center;padding:60px 10px 20px;color:var(--ink-soft)}
.empty.show{display:block;animation:fadeUp .5s var(--ease)}
.empty .emblem{width:90px;margin:0 auto 14px;color:var(--paper-line)}
.empty b{display:block;font-size:24px;font-weight:500;color:var(--ink)}
.note{margin:64px auto 0;max-width:46ch;text-align:center;font:400 13px/1.6 var(--sans);color:var(--ink-faint)}
mark{background:linear-gradient(transparent 55%,rgba(199,162,90,.45) 55%);color:inherit;padding:0 1px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);filter:blur(4px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}
.rv.on{opacity:1;transform:none;filter:none}

/* ---------- house (night) ---------- */
.house{position:relative;padding:96px 0 40px;background:
  radial-gradient(80% 40% at 50% 0%,rgba(140,58,69,.18),transparent 70%),var(--night)}
.house::before{content:"";position:absolute;left:0;right:0;top:-1px;height:28px;background:var(--paper-2);-webkit-mask:radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 0/28px 28px repeat-x;mask:radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 0/28px 28px repeat-x}
.eyebrow{font:500 11px var(--sans);letter-spacing:.38em;text-transform:uppercase;color:var(--gold);text-align:center}
.h2{font-weight:400;font-style:italic;text-align:center;font-size:clamp(34px,8vw,52px);line-height:1.08;margin:10px 0 0;text-wrap:balance}
.story{margin:34px auto 0;max-width:58ch;font-size:20px;color:#d9d0bc}
.story p{margin:0 0 16px}
.story p:first-child::first-letter{float:left;font-family:var(--black);font-size:78px;line-height:.8;padding:6px 10px 0 0;color:var(--gold)}
.seal{display:flex;align-items:center;gap:18px;margin:36px auto 0;max-width:520px;padding:18px;border-radius:var(--r);border:1px solid rgba(199,162,90,.25);background:linear-gradient(135deg,rgba(199,162,90,.1),transparent)}
.seal-badge{flex:none;width:92px;height:92px;position:relative;color:var(--gold)}
.seal-badge svg{width:100%;height:100%}
.seal-badge .ring{animation:spin 24s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.seal-badge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--black);font-size:28px;font-weight:400;color:var(--gold-bright)}
.seal p{margin:0;font-size:18px;line-height:1.35}
.seal small{display:block;font:500 12px var(--sans);letter-spacing:.03em;color:var(--moon-soft);margin-top:4px}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:40px}
.feat{position:relative;padding:20px 16px;border-radius:var(--r);background:linear-gradient(180deg,var(--night-2),rgba(21,35,30,.4));border:1px solid rgba(233,225,207,.07);overflow:hidden;transition:transform .5s var(--ease),border-color .5s}
.feat::before{content:"";position:absolute;inset:auto -30% -60% -30%;height:120%;background:radial-gradient(closest-side,rgba(199,162,90,.18),transparent);opacity:0;transition:opacity .6s}
.feat:hover{transform:translateY(-3px);border-color:rgba(199,162,90,.3)}
.feat:hover::before{opacity:1}
.feat .ico{font-size:30px;color:var(--gold);stroke-width:1.2}
.feat h4{margin:12px 0 4px;font-size:21px;font-weight:600;line-height:1.15}
.feat p{margin:0;font:400 13px/1.5 var(--sans);color:var(--moon-soft)}
.grid2{display:grid;gap:14px;margin-top:64px}
.card{border-radius:var(--r);background:var(--night-2);border:1px solid rgba(233,225,207,.08);padding:22px}
.card h3{margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:500}
.card h3 .ico{color:var(--gold);font-size:22px}
.hours{list-style:none;margin:0;padding:0;font-family:var(--sans);font-size:14px}
.hours li{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;color:var(--moon-soft)}
.hours li.today{background:rgba(199,162,90,.14);color:var(--moon)}
.hours li.today span:first-child::after{content:attr(data-today);margin-left:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hours-note{margin:12px 0 0;font:400 12px/1.5 var(--sans);color:var(--moon-soft)}
.addr{font-size:20px;line-height:1.35;margin:0}
.addr small{display:block;font:400 13px var(--sans);color:var(--moon-soft);margin-top:4px}
.map{margin:16px 0;border-radius:14px;overflow:hidden;aspect-ratio:16/10;background:var(--night-3);position:relative;border:1px solid rgba(199,162,90,.2)}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(.55) sepia(.35) contrast(.95) brightness(.92)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid rgba(233,225,207,.14);font:500 14px var(--sans);text-decoration:none;color:var(--moon);transition:background .25s,border-color .25s}
.btn:hover{background:rgba(233,225,207,.06);border-color:rgba(199,162,90,.4)}
.btn .ico{font-size:18px;color:var(--gold)}
.btn.primary{grid-column:1 / -1;background:var(--gold);color:#23190c;border-color:var(--gold)}
.btn.primary .ico{color:#23190c}
.btn.primary:hover{background:var(--gold-bright)}
footer{text-align:center;padding:72px 20px calc(120px + var(--safe-b));color:var(--moon-soft)}
footer .emblem{width:120px;margin:0 auto;color:var(--gold)}
footer p{margin:14px 0 0;font-style:italic;font-size:20px;color:var(--moon)}
footer small{display:block;margin-top:18px;font:400 12px/1.6 var(--sans)}
footer .sign{display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;margin:30px auto 0;padding:18px 18px 0;border-top:1px solid rgba(199,162,90,.25);font:500 10px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--moon-soft);text-decoration:none}
footer .sign span{margin-right:-.32em}
footer .sign b{font:italic 400 24px/1 var(--serif);font-variant-numeric:lining-nums;letter-spacing:.02em;text-transform:none;color:var(--gold);transition:color .3s}
footer .sign:hover b{color:var(--gold-bright)}

/* ---------- order bar ---------- */
.obar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:45;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--ink);color:var(--paper);box-shadow:0 18px 40px -12px rgba(0,0,0,.55),0 0 0 1px rgba(199,162,90,.35);transform:translateY(150%);transition:transform .55s var(--ease-spring)}
.obar.show{transform:none}
.bag{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--gold-bright);background:rgba(199,162,90,.15)}
.bag b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;font:600 11px/20px var(--sans);text-align:center}
.bag.bump{animation:bump .5s var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.22) rotate(-6deg)}}
.obar-t{flex:1;min-width:0;font-family:var(--sans);line-height:1.2}
.obar-t small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.obar-t span{font-size:16px;font-weight:500}
.obar .go{padding:12px 16px;border-radius:14px;background:var(--gold);color:#23190c;font:600 13px var(--sans);letter-spacing:.06em;white-space:nowrap}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,10,8,.6);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.scrim.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;overflow:hidden;max-width:620px;margin:0 auto;max-height:92svh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;color:var(--ink);background:radial-gradient(120% 50% at 50% 0%,#fffaf0,var(--paper));box-shadow:0 -20px 60px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .55s var(--ease);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet.drag{transition:none}
.grab{position:absolute;top:0;left:0;right:0;z-index:3;padding:10px 0 12px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet.has-photo .grab i{background:rgba(255,255,255,.85);box-shadow:0 1px 6px rgba(0,0,0,.3)}
.sheet.has-photo .sheet-x{background:rgba(255,250,240,.9);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.grab i{width:44px;height:5px;border-radius:9px;background:var(--paper-line)}
.sheet-x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(35,27,20,.06);z-index:2}
.sheet-body{overflow-y:auto;padding:30px 22px 22px;overscroll-behavior:contain}
.sheet.has-photo .sheet-body{padding-top:0}
.d-photo{margin:0 -22px;aspect-ratio:5/4;max-height:44svh;width:calc(100% + 44px);display:block}
.d-photo > .ico{font-size:80px;left:50%;top:50%;transform:translate(-50%,-50%)}
.d-photo::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:38%;background:linear-gradient(transparent,#fcf6ea);pointer-events:none}
.d-photo .spark{position:absolute;z-index:2;width:8px;height:8px;color:#fff6dd;filter:drop-shadow(0 0 4px rgba(240,220,166,.9));animation:twinkle 2.4s ease-in-out infinite}
.d-photo .spark .ico{font-size:12px;position:static;stroke-width:0}
.d-x{margin:16px 0 0;padding:14px 16px;border-radius:14px;background:rgba(199,162,90,.1);border:1px solid rgba(199,162,90,.25);font:400 14px/1.5 var(--sans);color:var(--ink-soft)}
.d-x p{margin:0 0 6px}.d-x p:last-child{margin:0;font-size:12.5px;color:var(--ink-faint)}
.d-x b{color:var(--ink);font-weight:600}
.extras{display:flex;flex-wrap:wrap;gap:8px}
.xchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 10px;border-radius:99px;border:1px solid var(--paper-line);background:#fffaf0;font:500 13px var(--sans);color:var(--ink);transition:all .3s var(--ease)}
.xchip .ico{font-size:13px;color:var(--gold-deep)}
.xchip b{font-weight:400;color:var(--ink-faint)}
.xchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.xchip[aria-pressed="true"] .ico,.xchip[aria-pressed="true"] b{color:var(--gold-bright)}
.sheet-foot{padding:14px 22px calc(16px + var(--safe-b));border-top:1px solid var(--paper-line);background:rgba(244,236,219,.95)}
.d-art{height:150px;margin:0 -22px 0;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(60% 90% at 50% 100%,rgba(199,162,90,.25),transparent)}
.d-art .ico{font-size:96px;color:var(--gold-deep);stroke-width:.8;animation:float 5s ease-in-out infinite}
.d-art .spark{position:absolute;width:6px;height:6px;color:var(--gold);animation:twinkle 2.4s ease-in-out infinite}
.d-art .spark .ico{font-size:10px;stroke-width:0;animation:none}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.d-cat{font:500 11px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);text-align:center;margin-top:6px}
.d-name{text-align:center;font-size:34px;line-height:1.05;font-weight:600;margin:6px 0 0}
.d-desc{text-align:center;font-size:19px;color:var(--ink-soft);margin:10px auto 0;max-width:40ch}
.d-sec{margin-top:22px}
.d-sec > span{display:block;font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--paper-line);background:#fffaf0;text-align:left;transition:border-color .25s,box-shadow .25s}
.opt i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--paper-line);display:grid;place-items:center;flex:none;transition:border-color .25s}
.opt i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rose);transform:scale(0);transition:transform .35s var(--ease-spring)}
.opt[aria-checked="true"]{border-color:var(--rose);box-shadow:0 0 0 3px rgba(140,58,69,.12)}
.opt[aria-checked="true"] i{border-color:var(--rose)}
.opt[aria-checked="true"] i::after{transform:scale(1)}
.opt span{flex:1;font:500 15px var(--sans)}
.opt b{font:500 14px var(--sans);color:var(--ink-soft)}
textarea{width:100%;min-height:72px;resize:vertical;border-radius:14px;border:1px solid var(--paper-line);background:#fffaf0;padding:12px 14px;font:400 15px/1.4 var(--sans);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(199,162,90,.18)}
.foot-row{display:flex;gap:10px;align-items:center}
.qty{display:flex;align-items:center;border-radius:14px;border:1px solid var(--paper-line);background:#fffaf0}
.qty button{width:44px;height:50px;display:grid;place-items:center;font-size:18px}
.qty output{min-width:2ch;text-align:center;font:600 16px var(--sans)}
.big{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 18px;white-space:nowrap;border-radius:14px;background:var(--ink);color:var(--paper);font:600 14px var(--sans);letter-spacing:.04em;transition:transform .3s var(--ease-spring),background .3s}
.big:hover{background:var(--rose)}
.big:active{transform:scale(.98)}
.big.ghost{background:transparent;color:var(--ink);border:1px solid var(--paper-line);flex:none;justify-content:center}
.big.gold{background:var(--gold);color:#23190c}

.o-title{font-size:34px;font-weight:500;margin:4px 0 2px}
.o-sub{margin:0;font:400 13px var(--sans);color:var(--ink-faint)}
.o-list{list-style:none;padding:0;margin:14px 0 0}
.o-line{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(156,122,54,.3);animation:fadeUp .4s var(--ease) both}
.o-line.out{animation:slideOut .35s var(--ease) forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px);height:0;padding:0;margin:0}}
.o-name{display:block;font-size:20px;font-weight:600;line-height:1.15}
.o-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.o-th{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 1px var(--paper-line),0 0 0 3px #fffaf0,0 0 0 4px rgba(199,162,90,.4);margin:4px}
.o-th > .ico{font-size:20px}
.o-th.plus{display:grid;place-items:center;background:rgba(199,162,90,.12);color:var(--gold-deep);font-size:18px}
.o-line.sub{padding-left:26px;border-bottom-style:dotted}
.o-line.sub .o-th{width:34px;height:34px}
.o-line.sub .o-name{font-size:17px}
.o-meta{font:400 13px var(--sans);color:var(--ink-soft)}
.o-note{font-style:italic;font-size:15px;color:var(--rose)}
.o-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.o-right .price{font-size:15px}
.mini{display:flex;align-items:center;border-radius:99px;border:1px solid var(--paper-line);background:#fffaf0}
.mini button{width:32px;height:32px;display:grid;place-items:center;font-size:14px}
.mini output{min-width:2ch;text-align:center;font:600 14px var(--sans)}
.o-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-family:var(--sans)}
.o-total span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.o-total b{font-size:24px;font-weight:600}
.o-empty{text-align:center;padding:30px 0 10px;color:var(--ink-soft)}
.o-empty .ico{font-size:54px;margin:0 auto 10px;color:var(--paper-line);stroke-width:1}
.o-hint{margin:10px 0 0;font:400 12px/1.5 var(--sans);color:var(--ink-faint);text-align:center}

/* ---------- counter ticket ---------- */
.ticket-v{position:fixed;inset:0;z-index:80;background:var(--night);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + var(--safe-b));overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.ticket-v.show{opacity:1;visibility:visible}
.ticket{width:100%;max-width:460px;margin:auto 0;color:var(--ink);background:var(--paper);padding:28px 24px 30px;position:relative;transform:translateY(30px) rotate(-1deg);transition:transform .7s var(--ease-spring);
  -webkit-mask:radial-gradient(9px at 50% 0,transparent 97%,#000) 0 0/22px 51% repeat-x,radial-gradient(9px at 50% 100%,transparent 97%,#000) 0 100%/22px 51% repeat-x;
  mask:radial-gradient(9px at 50% 0,transparent 97%,#000) 0 0/22px 51% repeat-x,radial-gradient(9px at 50% 100%,transparent 97%,#000) 0 100%/22px 51% repeat-x}
.ticket-v.show .ticket{transform:none}
.ticket .emblem{width:120px;margin:6px auto 0;color:var(--ink)}
.t-h{text-align:center;font:600 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
.t-time{text-align:center;font:400 13px var(--sans);color:var(--ink-soft);margin-top:2px}
.t-list{list-style:none;margin:20px 0 0;padding:16px 0 0;border-top:2px dashed var(--paper-line)}
.t-list li{display:grid;grid-template-columns:auto 1fr;gap:0 14px;padding:10px 0;align-items:baseline}
.t-list li.sub{padding:2px 0 8px 22px}
.t-list li.sub .t-q{font-size:20px}.t-list li.sub .t-n{font-size:21px}
.t-q{font:600 28px var(--sans);color:var(--rose);min-width:2.2ch}
.t-n{font-size:27px;font-weight:600;line-height:1.1}
.t-n small{display:block;font:500 15px var(--sans);color:var(--ink-soft);margin-top:2px}
.t-n em{display:block;font-size:18px;color:var(--rose)}
.t-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:2px dashed var(--paper-line);font-family:var(--sans)}
.t-sum b{font-size:28px}
.t-sum span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.t-foot{text-align:center;font-style:italic;font-size:17px;color:var(--ink-soft);margin:16px 0 0}
.ticket-actions{display:flex;gap:10px;width:100%;max-width:460px;margin-top:18px}
.ticket-actions .big{justify-content:center;color:var(--moon);border-color:rgba(233,225,207,.3)}

/* ---------- toast & fx ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));z-index:90;transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:99px;background:var(--paper);color:var(--ink);font:500 13px var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:all .4s var(--ease);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ico{color:var(--rose)}
.fly{position:fixed;z-index:95;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff6dd,var(--gold) 60%,transparent 70%);box-shadow:0 0 14px 4px rgba(240,220,166,.7);pointer-events:none}
.spk{position:fixed;z-index:95;pointer-events:none;width:10px;height:10px;margin:-5px 0 0 -5px;color:var(--gold)}
.trail{position:fixed;z-index:30;pointer-events:none;width:8px;height:8px;margin:-4px 0 0 -4px;color:var(--gold-bright);animation:trail 1s var(--ease) forwards}
@keyframes trail{from{opacity:1;transform:scale(1)}to{opacity:0;transform:translateY(14px) scale(.2) rotate(90deg)}}

@media (min-width:720px){
  body{font-size:19px}
  .thumb{width:96px;height:116px;border-radius:48px 48px 14px 14px}
  .xgrid{grid-template-columns:repeat(3,1fr)}
  .feats{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1.25fr}
  .sheet{bottom:50%;border-radius:26px;transform:translateY(calc(50% + 40px)) scale(.96);opacity:0;transition:transform .5s var(--ease),opacity .4s,visibility .4s}
  .sheet.show{transform:translateY(50%);opacity:1}
  .grab{display:none}
  .sheet-body{padding-top:18px}
  .obar{bottom:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none;filter:none}
  .arch path{stroke-dashoffset:0}
  .arch .bloom{transform:none}
  .hero .in{opacity:1}
}

.lang{backdrop-filter:none;background:transparent;border-color:rgba(199,162,90,.3)}

.cat{margin-top:64px}

[data-ph]{background:#ece3d0;animation:none}
.item{padding:16px 0;border-bottom:1px solid rgba(216,200,166,.55);border-radius:0;gap:16px}

/* ============ barra de navegação (mobile first) ============ */
.grid2{grid-template-columns:minmax(0,1fr)}

@media (min-width:720px){ .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)} }
.bar{background:rgba(14,24,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(233,225,207,.07);transform:translateY(-100%);transition:transform .45s var(--ease)}
.bar.show{transform:none}
.bar.show.slim{transform:translateY(calc(-1 * (48px + env(safe-area-inset-top,0px))))}
.bar-in{max-width:1180px;margin:0 auto}
.bar-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand actions" "tabs tabs";align-items:center;padding-top:env(safe-area-inset-top,0px)}
.brand{grid-area:brand;display:flex;align-items:center;height:48px;padding:0 16px;text-decoration:none}
.brand .emblem{width:52px;color:var(--gold)}
.actions{grid-area:actions;display:flex;align-items:center;gap:2px;padding-right:8px}

.tabs{grid-area:tabs;display:flex;align-items:stretch;min-width:0;border-top:1px solid rgba(233,225,207,.06)}

.chip:hover{color:var(--moon)}

/* ================= status & hours ================= */
function spNow(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  const g = k=>parts.find(p=>p.type===k).value;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday"));
  return {wd, h:(+g("hour"))%24 + (+g("minute"))/60};
}
function renderStatus(){
  const t=L(), {wd,h}=spNow(), [o,c]=HOURS[wd], el=$("#status");
  let txt, open=false;
  if(h>=o && h<c){ txt=t.open(c); open=true; }
  else if(h<o){ txt=t.closedLater(o); }
  else { const n=(wd+1)%7; txt=t.closedTomorrow(t.tomorrow, HOURS[n][0]); }
  el.classList.toggle("closed",!open); $("span",el).textContent=txt;
}
function renderHours(){
  const t=L(), {wd}=spNow(), order=[1,2,3,4,5,6,0];
  const hh = v => S.lang==="pt" ? `${v}h` : fmtHour(v);
  $("#hours").innerHTML = order.map(d=>`<li class="${d===wd?"today":""}"><span data-today="${t.today}">${t.days[d]}</span><span>${hh(HOURS[d][0])} – ${hh(HOURS[d][1])}</span></li>`).join("");
}

const FILTERS = {gf:"wheat", lf:"milk", sf:"cube", vg:"leaf"};
function renderFilters(){
  const t=L();

}
const onFilter=e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  const k=b.dataset.f; S.filters.has(k)?S.filters.delete(k):S.filters.add(k);
  $$(`[data-f="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",S.filters.has(k)));
  filterMenu(true); toResults();
};
$("#filters").addEventListener("click",onFilter); $("#barFilters").addEventListener("click",onFilter);
const hl = (txt,q)=>{
  if(!q) return esc(txt);
  const n=norm(txt), i=n.indexOf(q); if(i<0) return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+q.length))+"</mark>"+esc(txt.slice(i+q.length));
};
const sameOptPrice = it => it.opts && it.opts.every(o=>o.p===it.opts[0].p);
function priceHTML(it){
  if(!it.opts) return money(it.p);
  if(sameOptPrice(it)) return money(it.opts[0].p);
  return `<small>${L().from} </small>${money(minPrice(it))}`;
}
function optsLine(it){
  if(!it.opts) return "";
  const same=sameOptPrice(it);
  return it.opts.map(o=>same?esc(o.l[S.lang]):`${esc(o.l[S.lang])} <b>${money(o.p)}</b>`).join(`<i> · </i>`);
}
function imgHTML(file,w,h,cls,alt,eager){
  if(!file) return "";
  return `<img class="${cls}" src="${WIX(file,w,h)}" alt="${esc(alt)}" width="${w}" height="${h}" ${eager?"":'loading="lazy"'} decoding="async" onload="this.classList.add('ok')" onerror="this.closest('[data-ph]')?.classList.add('noimg');this.remove()">`;
}
function tagsHTML(it){
  const t=L();
  return it.tags.map(k=>`<span class="tag">${icon(FILTERS[k])}${t.tag[k]}</span>`).join("");
}
function itemHTML(it){
  const q=norm(S.q.trim());
  if(it.cat.compact){
    return `<div class="item xi" data-id="${it.id}">
      <span class="item-name">${hl(it.n[S.lang],q)}</span>
      <span class="xi-row"><span class="price">+ ${money(it.p)}</span><span class="ctrl">${ctrlHTML(it)}</span></span></div>`;
  }
  const d = it.d ? it.d[S.lang] : "";
  const tags = tagsHTML(it);
  return `<article class="item" data-id="${it.id}" tabindex="0" role="button" aria-label="${esc(it.n[S.lang])}">
    <span class="thumb" data-ph>${icon(it.cat.icon)}${imgHTML(it.i,168,200,"",it.n[S.lang])}</span>
    <div class="body">
      <span class="item-name">${hl(it.n[S.lang],q)}</span>
      ${d?`<p class="item-desc">${hl(d,q)}</p>`:""}
      ${it.opts?`<p class="item-opts">${optsLine(it)}</p>`:""}
      <div class="item-foot"><span class="price">${priceHTML(it)}</span>${tags?`<span class="tags">${tags}</span>`:""}</div>
    </div>
    <div class="ctrl">${ctrlHTML(it)}</div>
  </article>`;
}
function ctrlHTML(it){
  const q=qtyOf(it.id), t=L();
  if(it.cat.compact){
    if(!q) return `<button class="add sm" data-add="${it.id}" aria-label="${t.add}: ${esc(it.n[S.lang])}">${icon("plus")}</button>`;
    return `<span class="mini dark"><button data-dec="${it.id}" aria-label="−1">${icon("minus")}</button><output>${q}</output><button data-inc="${it.id}" aria-label="+1">${icon("plus")}</button></span>`;
  }
  if(!q || it.opts) return `<button class="add" data-add="${it.id}" aria-label="${t.add}: ${esc(it.n[S.lang])}">${q&&it.opts?`<span class="qn">${q}</span>`:icon("plus")}</button>`;
  return `<div class="stepper"><button data-inc="${it.id}" aria-label="+1">${icon("plus")}</button><output>${q}</output><button data-dec="${it.id}" aria-label="−1">${icon("minus")}</button></div>`;
}
const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
function renderMenu(){
  $("#menu").innerHTML = MENU.map((c,ci)=>`
    <section class="cat${c.compact?" compact":""}" id="cat-${c.id}" data-cat="${c.id}">
      ${c.cover?`<div class="cover rv" data-ph>${icon(c.icon)}<img src="${WIX(c.cover,1000,560)}" srcset="${WIX(c.cover,640,360)} 640w, ${WIX(c.cover,1000,560)} 1000w, ${WIX(c.cover,1400,700)} 1400w" sizes="(min-width:760px) 724px, 100vw" alt="" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.closest('[data-ph]').classList.add('noimg');this.remove()"></div>`:""}
      <div class="cat-h rv">
        <div class="cat-t"><small>${S.lang==="pt"?`${c.items.length} opções`:`${c.items.length} items`}</small><h3>${c.t[S.lang]}</h3><p>${c.s[S.lang]}</p></div>
      </div>
      
      <div class="items${c.compact?" xgrid":""}">${c.items.map(it=>itemHTML(ITEMS.get(it.id))).join("")}</div>
    </section>`).join("");
  $$("#menu .item").forEach((el,i)=>{ el.classList.add("rv"); el.style.setProperty("--d", (i%3*.06)+"s"); });
  filterMenu(false);
}
function hayOf(it){
  if(!it._hay) it._hay = norm([it.n.pt,it.n.en,it.d?.pt,it.d?.en,it.x?.pt,it.x?.en,...(it.opts||[]).flatMap(o=>[o.l.pt,o.l.en]),it.cat.t.pt,it.cat.t.en].filter(Boolean).join(" "));
  return it._hay;
}
function filterMenu(user){
  const q=norm(S.q.trim());
  let any=false;
  if(user){
    $$("#menu .rv").forEach(el=>el.classList.add("on"));
    $$("#menu .item").forEach(el=>{
      const it=ITEMS.get(el.dataset.id);
      $(".item-name",el).innerHTML=hl(it.n[S.lang],q);
      const d=$(".item-desc",el); if(d) d.innerHTML=hl(it.d[S.lang],q);
    });
  }
  const filtering = q || S.filters.size;
  $$(".cat").forEach(sec=>{
    let vis=0;
    $$(".item",sec).forEach(el=>{
      const it=ITEMS.get(el.dataset.id);
      const ok=(!q||hayOf(it).includes(q)) && [...S.filters].every(f=>it.tags.includes(f));
      el.classList.toggle("hide",!ok); if(ok) vis++;
    });
    sec.classList.toggle("hide",!vis);
    sec.classList.toggle("filtering",!!filtering);
    if(vis) any=true;
  });
  $("#empty").classList.toggle("show",!any);
  $("#searchBox").classList.toggle("has",!!S.q);
  renderChips();
}
const BAR=$("#bar"), MQD=matchMedia("(min-width:900px)");
const barBottom=()=>Math.max(0,BAR.getBoundingClientRect().bottom);
function toResults(){
  if(!(S.q.trim()||S.filters.size)) return;

function openSearch(){
  const q=$("#q");
  BAR.classList.add("searching","show"); BAR.classList.remove("slim");
  q.focus({preventScroll:true});
  const top=$("#menu").getBoundingClientRect().top+scrollY-(BAR.offsetHeight+8);
  if(scrollY<top-4 || scrollY>top+4) scrollTo({top,behavior:"auto"});

}
function closeSearch(){
  S.q=""; $("#q").value=""; S.filters.clear(); $$("[data-f]").forEach(x=>x.setAttribute("aria-pressed","false"));
  BAR.classList.remove("searching"); filterMenu(true); syncBar();
}
let qT; $("#q").addEventListener("input",e=>{ S.q=e.target.value; clearTimeout(qT); qT=setTimeout(()=>{filterMenu(true);toResults();},120); });
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape") closeSearch(); });
$("#qClear").addEventListener("click",()=>{ S.q=""; $("#q").value=""; filterMenu(true); $("#q").focus(); });
$("#qCancel").addEventListener("click",closeSearch);
$("#barSearch").addEventListener("click",openSearch);
$("#openSearch").addEventListener("click",openSearch);

$("#menu").addEventListener("click",e=>{
  const add=e.target.closest("[data-add]"), inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]");
  if(add){ e.stopPropagation(); const it=ITEMS.get(add.dataset.add);
    if(!it.cat.compact && (it.opts || qtyOf(it.id))) return openItem(it.id);
    addLine(it.id,null,1,"",add); return; }
  if(inc){ e.stopPropagation(); addLine(inc.dataset.inc,null,1,"",inc); return; }
  if(dec){ e.stopPropagation(); decItem(dec.dataset.dec); return; }
  const card=e.target.closest(".item"); if(!card) return;
  const it=ITEMS.get(card.dataset.id);
  if(it.cat.compact){ const b=$("[data-add],[data-inc]",card); addLine(it.id,null,1,"",b||card); return; }
  openItem(it.id);
});
$("#menu").addEventListener("keydown",e=>{

/* ================= abas & scrollspy ================= */
function renderChips(){
  const box=$("#chips");
  $$(".chip",box).forEach(c=>c.remove());
  MENU.forEach(c=>{
    if($(`#cat-${c.id}`)?.classList.contains("hide")) return;
    const b=document.createElement("button"); b.className="chip"; b.dataset.go=c.id; b.textContent=(c.nav||c.t)[S.lang]; b.title=c.t[S.lang];
    box.appendChild(b);
  });
  requestAnimationFrame(()=>{ spy(true); fades(); });
}
function fades(){
  const c=$("#chips"), max=c.scrollWidth-c.clientWidth;
  c.classList.toggle("fl", c.scrollLeft>4); c.classList.toggle("fr", c.scrollLeft<max-4);
}
$("#chips").addEventListener("scroll",fades,{passive:true});
let lockUntil=0;
function jumpTo(id){
  const el=$(`#cat-${id}`); if(!el) return;
  const target=el.getBoundingClientRect().top+scrollY;
  const down=target>scrollY;
  const mobile=!MQD.matches;
  if(mobile && !BAR.classList.contains("searching")) BAR.classList.toggle("slim",down);
  const off = (mobile && down) ? $(".tabs").offsetHeight : BAR.offsetHeight;
  lockUntil=performance.now()+900;
  scrollTo({top:target-off-6,behavior:RM?"auto":"smooth"});
}
$("#chips").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) jumpTo(b.dataset.go); });
let activeCat=null;
function spy(force){
  const line=barBottom()+48;
  let cur=null;
  $$(".cat:not(.hide)").forEach(s=>{ if(s.getBoundingClientRect().top<=line) cur=s.dataset.cat; });
  if(!cur) cur=$(".cat:not(.hide)")?.dataset.cat;
  const chips=$$("#chips .chip"), ind=$("#chipInd");
  chips.forEach(c=>{ c.classList.toggle("active",c.dataset.go===cur); c.setAttribute("aria-current", c.dataset.go===cur?"true":"false"); });
  const a=chips.find(c=>c.dataset.go===cur);
  if(!a){ ind.style.width="0"; return; }
  ind.style.width=(a.offsetWidth-24)+"px"; ind.style.transform=`translateX(${a.offsetLeft+12}px)`;
  if(cur!==activeCat || force){ activeCat=cur; const box=$("#chips"); box.scrollTo({left:a.offsetLeft-box.clientWidth/2+a.offsetWidth/2,behavior:(RM||force)?"auto":"smooth"}); }
}
// barra: aparece depois do topo; no celular, a linha de cima recolhe ao rolar para baixo
function syncBar(){ document.documentElement.style.setProperty("--barB", barBottom()+"px"); }
let ticking=false, lastY=scrollY;
addEventListener("scroll",()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const y=scrollY, heroEnd=$("#hero").offsetHeight*0.72;
    const searching=BAR.classList.contains("searching");
    BAR.classList.toggle("show", y>heroEnd || searching);
    if(!MQD.matches && !searching && performance.now()>lockUntil){
      if(y>lastY+8 && y>heroEnd+120) BAR.classList.add("slim");
      else if(y<lastY-8) BAR.classList.remove("slim");
    }
    if(y<heroEnd) BAR.classList.remove("slim");
    lastY=y;
    spy(); syncBar();
  });
},{passive:true});
function setBarH(){ syncBar(); fades(); }
addEventListener("resize",()=>requestAnimationFrame(()=>{ if(MQD.matches) BAR.classList.remove("slim"); setBarH(); spy(true); }));

/* ================= order ================= */
// linha: {id, opt, qty, note, forId}
function addLine(id,opt,qty,note,fromEl,forId){
  const k=lineKey(id,opt)+(forId?`>${forId}`:""), cur=S.order.get(k);
  if(cur){ cur.qty+=qty; if(note) cur.note=note; }
  else S.order.set(k,{id,opt,qty,note:note||"",forId:forId||null});
  afterOrderChange(id);
  if(fromEl){ flyToBag(fromEl); toast(L().added); }
}
function changeQty(k,d){
  const l=S.order.get(k); if(!l) return;
  l.qty+=d; if(l.qty<=0) S.order.delete(k);
  afterOrderChange(l.id);
}
function decItem(id){
  const keys=[...S.order.keys()].filter(k=>S.order.get(k).id===id);
  if(!keys.length) return;
  const k = keys.includes(lineKey(id,null)) ? lineKey(id,null) : keys[keys.length-1];
  changeQty(k,-1);
}
function afterOrderChange(id){
  if(id){ const it=ITEMS.get(id); $$(`.item[data-id="${id}"] .ctrl`).forEach(c=>c.innerHTML=ctrlHTML(it)); }
  renderBar();
  if(sheetMode==="order") renderOrderBody();
}
function totals(){ let n=0,s=0; S.order.forEach(l=>{n+=l.qty; s+=l.qty*linePrice(l);}); return {n,s}; }
function renderBar(){
  const {n,s}=totals(), t=L();
  $("#bagN").textContent=n;
  $("#obarTotal").textContent=`${t.items(n)} · ${money(s)}`;
  $("#obar").classList.toggle("show", n>0 && !sheetMode);
}
function bump(){ const b=$("#bag"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
function flyToBag(el){
  const r=el.getBoundingClientRect(), x0=r.left+r.width/2, y0=r.top+r.height/2;
  sparkle(x0,y0);
  if(RM){ bump(); return; }
  setTimeout(()=>{
    const ob=$("#obar"), bg=$("#bag"), x1=ob.offsetLeft+bg.offsetLeft+bg.offsetWidth/2, y1=ob.offsetTop+bg.offsetTop+bg.offsetHeight/2;
    const d=document.createElement("i"); d.className="fly"; d.style.left=x0+"px"; d.style.top=y0+"px"; document.body.appendChild(d);
    const dx=x1-x0, dy=y1-y0;
    d.animate([
      {transform:"translate(0,0) scale(1)"},
      {transform:`translate(${dx*.35}px,${dy*.35-90}px) scale(1.4)`,offset:.4},
      {transform:`translate(${dx}px,${dy}px) scale(.4)`,opacity:.6}
    ],{duration:700,easing:"cubic-bezier(.5,0,.4,1)"}).onfinish=()=>{d.remove();bump();};
  }, 60);
}
function sparkle(x,y){
  if(RM) return;
  for(let i=0;i<9;i++){
    const s=document.createElement("span"); s.className="spk"; s.innerHTML=icon("spark","ico");
    s.style.left=x+"px"; s.style.top=y+"px"; document.body.appendChild(s);
    const a=(i/9)*Math.PI*2+Math.random()*.4, r=26+Math.random()*26, sc=.6+Math.random()*.9;
    s.animate([{transform:"translate(0,0) scale(0)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(${sc}) rotate(90deg)`,opacity:0}],{duration:650+Math.random()*250,easing:"cubic-bezier(.2,.7,.2,1)"}).onfinish=()=>s.remove();
  }
}
let toastT;
function toast(msg){ const el=$("#toast"); $("span",el).textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1600); }

/* ================= sheet ================= */
let sheetMode=null, lastFocus=null;
function openSheet(mode){
  if(!sheetMode) lastFocus=document.activeElement;
  sheetMode=mode;
  $("#sheet").classList.toggle("has-photo", mode==="item-photo");
  $("#scrim").classList.add("show"); $("#sheet").classList.add("show");
  $("#obar").classList.remove("show");
  $("#sheetBody").scrollTop=0;
  document.body.style.overflow="hidden";
  setTimeout(()=>$("#sheetX").focus({preventScroll:true}),60);
}
function closeSheet(){
  if(!sheetMode) return;
  sheetMode=null;
  $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show");
  $("#sheet").style.transform="";
  document.body.style.overflow="";
  renderBar();
  lastFocus?.focus?.({preventScroll:true});
}
$("#scrim").addEventListener("click",closeSheet);
$("#sheetX").addEventListener("click",closeSheet);
addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if($("#ticketV").classList.contains("show")) return closeTicket();
  closeSheet();
});
(()=>{ // arrastar para fechar
  const sh=$("#sheet"), g=$("#grab"); let y0=null, dy=0;
  g.addEventListener("pointerdown",e=>{ y0=e.clientY; dy=0; sh.classList.add("drag"); g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove",e=>{ if(y0==null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=`translateY(${dy}px)`; });
  const end=()=>{ if(y0==null) return; y0=null; sh.classList.remove("drag"); if(dy>110) closeSheet(); else sh.style.transform=""; };
  g.addEventListener("pointerup",end); g.addEventListener("pointercancel",end);
})();

const EXTRAS = () => MENU.find(c=>c.compact).items.map(x=>ITEMS.get(x.id));
function openItem(id){
  const it=ITEMS.get(id), t=L();
  const existing = !it.opts ? S.order.get(lineKey(id,null)) : null;
  let opt = it.opts ? 0 : null, qty = existing ? existing.qty : 1;
  const note = existing ? existing.note : "";
  const extras = new Set();
  const offerExtras = EXTRA_CATS.includes(it.cat.id) && !existing;
  const sparks = Array.from({length:6},(_,i)=>`<span class="spark" style="left:${14+i*14}%;top:${18+((i*37)%50)}%;animation-delay:${i*.35}s">${icon("spark","ico")}</span>`).join("");
  $("#sheetBody").innerHTML = `
    ${it.i
      ? `<div class="d-photo" data-ph>${icon(it.cat.icon)}${imgHTML(it.i,900,720,"",it.n[S.lang],true)}</div>`
      : `<div class="d-art">${icon(it.cat.icon)}</div>`}
    <p class="d-cat">${it.cat.t[S.lang]}</p>
    <h2 class="d-name" id="sheetTitle">${esc(it.n[S.lang])}</h2>
    ${it.d?`<p class="d-desc">${esc(it.d[S.lang])}</p>`:""}
    ${it.tags.length?`<div class="tags" style="justify-content:center;margin-top:12px">${tagsHTML(it)}</div>`:""}
    ${it.x?`<div class="d-x">${esc(it.x[S.lang]).split("\n").map(l=>`<p>${l.replace(/^([^:]{3,22}):/,"<b>$1:</b>")}</p>`).join("")}</div>`:""}
    ${it.opts?`<div class="d-sec"><span>${t.choose}</span><div class="opts" role="radiogroup">${it.opts.map((o,i)=>`<button class="opt" role="radio" data-opt="${i}" aria-checked="${i===0}"><i></i><span>${esc(o.l[S.lang])}</span><b>${money(o.p)}</b></button>`).join("")}</div></div>`:""}
    ${offerExtras?`<div class="d-sec"><span>${t.extrasL}</span><div class="extras">${EXTRAS().map(x=>`<button class="xchip" data-x="${x.id}" aria-pressed="false">${icon("plus")}${esc(x.n[S.lang])} <b>${money(x.p)}</b></button>`).join("")}</div></div>`:""}
    <div class="d-sec"><span>${t.noteL}</span><textarea id="dNote" placeholder="${t.notePh}" maxlength="120">${esc(note)}</textarea></div>`;
  const foot=$("#sheetFoot");
  const draw=()=>{
    const unit = (it.opts ? it.opts[opt].p : it.p) + [...extras].reduce((a,x)=>a+ITEMS.get(x).p,0);
    const label = existing ? (qty===0 ? t.remove : t.update) : t.add;
    foot.innerHTML = `<div class="foot-row">
      <div class="qty"><button data-q="-1" aria-label="−1">${icon("minus")}</button><output>${qty}</output><button data-q="1" aria-label="+1">${icon("plus")}</button></div>
      <button class="big" id="dAdd"><span>${label}</span><span>${money(unit*Math.max(qty,1))}</span></button></div>`;
  };
  draw();
  $("#sheetBody").onclick=e=>{
    const o=e.target.closest("[data-opt]");
    if(o){ opt=+o.dataset.opt; $$(".opt",$("#sheetBody")).forEach(b=>b.setAttribute("aria-checked", b===o)); draw(); return; }
    const x=e.target.closest("[data-x]");
    if(x){ const k=x.dataset.x; extras.has(k)?extras.delete(k):extras.add(k); x.setAttribute("aria-pressed",extras.has(k)); x.innerHTML=x.innerHTML.replace(/#i-(plus|check)/, extras.has(k)?"#i-check":"#i-plus"); draw(); }
  };
  foot.onclick=e=>{
    const q=e.target.closest("[data-q]");
    if(q){ qty=Math.max(existing?0:1, Math.min(20, qty + +q.dataset.q)); draw(); return; }
    if(!e.target.closest("#dAdd")) return;
    const n=$("#dNote").value.trim(), btn=$("#dAdd");
    sparkle(...center(btn));
    if(existing){
      if(qty===0) S.order.delete(lineKey(id,null)); else { existing.qty=qty; existing.note=n; }
      closeSheet(); afterOrderChange(id); return;
    }
    const k=lineKey(id,opt), cur=S.order.get(k);
    if(cur){ cur.qty+=qty; if(n) cur.note=n; } else S.order.set(k,{id,opt,qty,note:n,forId:null});
    extras.forEach(x=>addLine(x,null,qty,"",null,id));
    closeSheet(); afterOrderChange(id);
    const ctrl=$(`.item[data-id="${id}"] .ctrl`);
    setTimeout(()=>{ if(ctrl) flyToBag(ctrl); toast(t.added); }, 120);
  };
  openSheet(it.i ? "item-photo" : "item");
}
const center = el=>{ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; };

function openOrder(keep){
  renderOrderBody();
  if(!keep) openSheet("order");
}
function orderedLines(){
  // agrupa adicionais logo abaixo do item a que pertencem
  const all=[...S.order.entries()], main=all.filter(([,l])=>!l.forId), out=[];
  main.forEach(e=>{ out.push(e); all.filter(([,l])=>l.forId===e[1].id).forEach(x=>{ if(!out.includes(x)) out.push(x); }); });
  all.forEach(e=>{ if(!out.includes(e)) out.push(e); });
  return out;
}
function renderOrderBody(){
  const t=L(), {n,s}=totals();
  const lines=orderedLines();
  $("#sheetBody").innerHTML = `
    <h2 class="o-title" id="sheetTitle">${t.oTitle}</h2><p class="o-sub">${t.oSub}</p>
    ${lines.length? `<ul class="o-list">${lines.map(([k,l],i)=>{
      const it=ITEMS.get(l.id), unit=linePrice(l);
      const thumb = it.i ? `<span class="o-th" data-ph>${icon(it.cat.icon)}${imgHTML(it.i,96,96,"",it.n[S.lang],true)}</span>` : `<span class="o-th plus">${icon(l.forId?"plus":it.cat.icon)}</span>`;
      return `<li class="o-line${l.forId?" sub":""}" style="animation-delay:${i*.04}s" data-k="${esc(k)}">
        ${thumb}
        <div class="o-main"><span class="o-name">${esc(it.n[S.lang])}</span>
        <span class="o-meta">${l.opt!=null?esc(it.opts[l.opt].l[S.lang])+" · ":""}${l.forId?`${t.forL} ${esc(ITEMS.get(l.forId).n[S.lang])} · `:""}${money(unit)}</span>
        ${l.note?`<span class="o-note">“${esc(l.note)}”</span>`:""}</div>
        <div class="o-right"><span class="price">${money(unit*l.qty)}</span>
          <div class="mini"><button data-ok="-1" aria-label="−1">${icon(l.qty===1?"x":"minus")}</button><output>${l.qty}</output><button data-ok="1" aria-label="+1">${icon("plus")}</button></div></div>
      </li>`;}).join("")}</ul>`
    : `<div class="o-empty">${icon("bag")}<b style="display:block;font-size:22px;color:var(--ink)">${t.oEmpty}</b>${t.oEmptyD}</div>`}
    <p class="o-hint">${t.hint}</p>`;
  $("#sheetFoot").innerHTML = lines.length ? `
    <div class="o-total"><span>${t.total} · ${t.items(n)}</span><b>${money(s)}</b></div>
    <div class="foot-row"><button class="big ghost" id="oClear">${t.clearAll}</button><button class="big gold" id="oShow" style="justify-content:center;gap:10px">${icon("ticket")}<span>${t.showCounter}</span></button></div>`
    : `<div class="foot-row"><button class="big" id="oBack" style="justify-content:center">${t.back}</button></div>`;
}
$("#sheetBody").addEventListener("click",e=>{
  if(sheetMode!=="order") return;
  const b=e.target.closest("[data-ok]"); if(!b) return;
  const li=b.closest(".o-line"), k=li.dataset.k, l=S.order.get(k), d=+b.dataset.ok;
  if(d<0 && l.qty===1 && !RM){ li.classList.add("out"); setTimeout(()=>changeQty(k,-1),300); }
  else changeQty(k,d);
});
$("#sheetFoot").addEventListener("click",e=>{
  if(sheetMode!=="order") return;
  if(e.target.closest("#oClear")){ const ids=[...new Set([...S.order.values()].map(l=>l.id))]; S.order.clear(); ids.forEach(id=>afterOrderChange(id)); }
  if(e.target.closest("#oBack")) closeSheet();
  if(e.target.closest("#oShow")) openTicket();
});
$("#openOrder").addEventListener("click",()=>openOrder());
$("#bag").addEventListener("click",()=>openOrder());

/* ================= counter ticket ================= */
function openTicket(){
  const t=L(), {s}=totals();
  const time=new Intl.DateTimeFormat(S.lang==="pt"?"pt-BR":"en-GB",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"}).format(new Date());
  $("#ticket").innerHTML=`
    <span class="emblem"></span>
    <p class="t-h">${t.tH}</p><p class="t-time">${time}</p>
    <ul class="t-list">${orderedLines().map(([,l])=>{const it=ITEMS.get(l.id);return `<li class="${l.forId?"sub":""}"><span class="t-q">${l.qty}×</span><span class="t-n">${l.forId?"+ ":""}${esc(it.n.pt)}${l.opt!=null?`<small>${esc(it.opts[l.opt].l.pt)}</small>`:""}${l.forId?`<small>no ${esc(ITEMS.get(l.forId).n.pt)}</small>`:""}${l.note?`<em>“${esc(l.note)}”</em>`:""}</span></li>`}).join("")}</ul>
    <div class="t-sum"><span>${t.total}</span><b>${money(s)}</b></div>
    <p class="t-foot">${t.tFoot}</p>`;
  $("#ticketV").classList.add("show");
  $("#ticketBack").focus({preventScroll:true});
  try{ navigator.wakeLock?.request("screen").then(w=>{window.__wl=w}).catch(()=>{}); }catch(_){}
}
function closeTicket(){ $("#ticketV").classList.remove("show"); try{window.__wl?.release()}catch(_){} $("#oShow")?.focus({preventScroll:true}); }
$("#ticketBack").addEventListener("click",closeTicket);

/* ================= reveal ================= */
let io;
function observeReveals(){
  io?.disconnect();
  if(RM || !("IntersectionObserver" in window)){ $$(".rv").forEach(e=>e.classList.add("on")); return; }
  io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("on"); io.unobserve(en.target);} }),{rootMargin:"0px 0px -8% 0px",threshold:.05});
  $$(".rv:not(.on)").forEach(e=>io.observe(e));
}

/* ================= luzes sutis ================= */
(()=>{
  const cv=$("#lights"), ctx=cv.getContext("2d"), hero=$("#hero");
  let W,H,parts=[],run=true,raf;
  const mk=init=>({x:Math.random()*W, y:init?Math.random()*H:H+10, r:Math.random()*1.1+.5, vy:-(Math.random()*.12+.04), ph:Math.random()*6.28, sp:Math.random()*.012+.004});
  function size(){
    const dpr=Math.min(devicePixelRatio||1,2); W=hero.clientWidth; H=hero.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    parts=Array.from({length:W<700?7:12},()=>mk(true));
  }
  function frame(){
    if(!run) return;
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.y+=p.vy; p.ph+=p.sp; if(p.y<-10) Object.assign(p,mk(false));
      const a=.18+.32*(.5+.5*Math.sin(p.ph)), R=p.r*4;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
      g.addColorStop(0,`rgba(240,220,166,${a})`); g.addColorStop(.4,`rgba(240,220,166,${a*.25})`); g.addColorStop(1,"rgba(240,220,166,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,7); ctx.fill();
    }
    raf=requestAnimationFrame(frame);
  }
  size(); addEventListener("resize",()=>{clearTimeout(size.t); size.t=setTimeout(size,150);});
  if(RM){ run=true; frame(); cancelAnimationFrame(raf); return; }
  new IntersectionObserver(([e])=>{ run=e.isIntersecting; if(run){cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);} }).observe(hero);
})();

applyLang(); setBarH();
setInterval(()=>{renderStatus();},60000);
